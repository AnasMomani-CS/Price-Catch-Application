name: price_catch_project
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.1.1 # تأكد من توافق الإصدارات مع الـ SDK تبعك
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2

  # State Management
  provider: ^6.1.2

  # Storage paths
  path_provider: ^2.1.3

  # Video (Splash screen)
  video_player: ^2.8.6

  # Google login
  google_sign_in: ^6.2.1
  auth_buttons: ^3.0.3

  # Icons
  font_awesome_flutter: ^10.7.0
  flutter_launcher_icons: ^0.13.1
  shared_preferences: ^2.5.4
  easy_localization: ^3.0.8
  intl: ^0.20.2
  image_picker: ^1.2.1
  firebase_storage: ^12.4.10
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  url_launcher_android: ^6.3.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/splash_animation.mp4

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

# هذا البلوك يجب أن يكون مستقلاً وفي بداية السطر تماماً
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
